name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tablero-viaje-grupal/app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez, pero NUNCA cancelar el que ya está en marcha:
# cancelar un deploy-pages a medias deja el despliegue de Pages colgado y el
# sitio sirviendo 404 hasta que se relanza a mano. Es lo que recomienda la
# propia plantilla oficial de GitHub para Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Re-registra el sitio de Pages con build_type=workflow en cada
          # despliegue. Si el sitio se quedó desconfigurado, deploy-pages
          # sigue reportando éxito contra un sitio que nadie sirve — que es
          # el único escenario que explica un 404 de GitHub con el artefacto
          # subido correctamente.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tablero-viaje-grupal/app
      - id: deployment
        uses: actions/deploy-pages@v4
